# Old uniqset.com URLs from the migration spreadsheet. $uri is percent-decoded,
# so the shipment URL also matches links containing encoded Cyrillic characters.
# Match the host explicitly to keep these rules scoped to the main domain.
map "$host:$uri" $legacy_redirect {
    default "";

    ~^uniqset\.com:/o-nas/contacts/?$ https://uniqset.com/contacts;
    ~^uniqset\.com:/o-nas/?$ https://uniqset.com/about;
    ~^uniqset\.com:/prodazha-oborudovaniya/?$ https://uniqset.com/services/prodazha-oborudovaniya;
    ~^uniqset\.com:/o-nas/vacancies/?$ https://uniqset.com/vacancy;
    ~^uniqset\.com:/o-nas/pochemu-my/?$ https://uniqset.com/why-we;
    ~^uniqset\.com:/import/?$ https://uniqset.com/services/import-oborudovaniya;
    ~^uniqset\.com:/prodazha-instrumenta/?$ https://uniqset.com/services/prodazha-instrumenta;
    ~^uniqset\.com:/vykup/?$ https://uniqset.com/services/vykup;
    ~^uniqset\.com:/2024/01/30/дип300-тип163-рмц-2800-1962г-в-отправили-в-ижевск/?$ https://uniqset.com/otgruzki;
}
