services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        APP_URL: ${APP_URL:-http://localhost:28080}
    container_name: uniqset2_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_public_data:/var/www/html/storage/app/public
    ports:
      - "${APP_HTTP_PORT:-28080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      APP_SCHEDULE_TIMEZONE: ${APP_SCHEDULE_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:28080}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-uniqset2-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-uniqset2}
      DB_USERNAME: ${DB_USERNAME:-uniqset2}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: ${REDIS_HOST:-uniqset2-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
      BACKEND_URL: ${BACKEND_URL:-http://127.0.0.1}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      HORIZON_BASIC_AUTH_USERNAME: ${HORIZON_BASIC_AUTH_USERNAME:-admin}
      HORIZON_BASIC_AUTH_PASSWORD: ${HORIZON_BASIC_AUTH_PASSWORD:-change-me}
      CATALOG_IMPORT_FEED_URL: ${CATALOG_IMPORT_FEED_URL:-https://panel.uniqset.com/storage/exports/advertisements.xml}
      CATALOG_IMPORT_IMAGE_DISK: ${CATALOG_IMPORT_IMAGE_DISK:-public}
      CATALOG_IMPORT_HTTP_TIMEOUT: ${CATALOG_IMPORT_HTTP_TIMEOUT:-60}
      CATALOG_IMPORT_QUEUE: ${CATALOG_IMPORT_QUEUE:-imports}
      CATALOG_IMPORT_UPDATE_EXISTING: ${CATALOG_IMPORT_UPDATE_EXISTING:-false}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    networks:
      - uniqset2_network
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        APP_URL: ${APP_URL:-http://localhost:28080}
    container_name: uniqset2_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - storage_public_data:/var/www/html/storage/app/public
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      APP_SCHEDULE_TIMEZONE: ${APP_SCHEDULE_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-uniqset2-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-uniqset2}
      DB_USERNAME: ${DB_USERNAME:-uniqset2}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: ${REDIS_HOST:-uniqset2-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
    networks:
      - uniqset2_network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.4
    container_name: uniqset2_db
    restart: unless-stopped
    command: ["--defaults-file=/etc/mysql/conf.d/my.cnf"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uniqset2}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-uniqset2}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      uniqset2_network:
        aliases:
          - uniqset2-db
          - mysql

  redis:
    image: redis:7-alpine
    container_name: uniqset2_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      uniqset2_network:
        aliases:
          - redis
          - uniqset2-redis

volumes:
  storage_public_data:
  db_data:
  redis_data:

networks:
  uniqset2_network:
    driver: bridge
